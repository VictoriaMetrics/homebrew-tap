name: bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check for a new VictoriaMetrics release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/VictoriaMetrics/VictoriaMetrics/releases/latest --jq .tag_name)"
          latest="${latest#v}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/vmctl.rb)"
          bump=true
          if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "No release newer than $current (latest: $latest)."
            bump=false
          elif git ls-remote --exit-code origin "refs/heads/bump-vmctl-${latest}" >/dev/null 2>&1; then
            echo "Bump branch for $latest already exists."
            bump=false
          fi
          {
            echo "latest=$latest"
            echo "bump=$bump"
          } >> "$GITHUB_OUTPUT"

      - name: Update formula and changelog, open PR
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            url="https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v${VERSION}/vmutils-${asset}-v${VERSION}.tar.gz"
            curl --fail --location --silent --output "/tmp/${asset}.tar.gz" "$url"
            shasum -a 256 "/tmp/${asset}.tar.gz" | cut -d' ' -f1 > "/tmp/${asset}.sha256"
          done
          old_version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/vmctl.rb)"
          sed -i "s/^  version \"${old_version}\"$/  version \"${VERSION}\"/" Formula/vmctl.rb
          for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            sha="$(cat "/tmp/${asset}.sha256")"
            awk -v asset="$asset" -v sha="$sha" '
              index($0, "vmutils-" asset "-") { print; getline; sub(/"[0-9a-f]+"/, "\"" sha "\"") }
              { print }
            ' Formula/vmctl.rb > Formula/vmctl.rb.new
            mv Formula/vmctl.rb.new Formula/vmctl.rb
          done
          grep -q "^  version \"${VERSION}\"$" Formula/vmctl.rb
          for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            grep -q "$(cat "/tmp/${asset}.sha256")" Formula/vmctl.rb
          done
          # shellcheck disable=SC2016  # literal markdown backticks, versions injected via quoted expansions
          sed -i 's/^| `vmctl` | '"${old_version}"' |/| `vmctl` | '"${VERSION}"' |/' README.md
          # shellcheck disable=SC2016
          grep -qF '| `vmctl` | '"${VERSION}"' |' README.md
          changelog_line="* FEATURE: [vmctl](https://docs.victoriametrics.com/victoriametrics/vmctl/): update to [v${VERSION}](https://github.com/VictoriaMetrics/VictoriaMetrics/releases/tag/v${VERSION})."
          awk -v line="$changelog_line" '{ print } /^## tip$/ { getline; print; print line }' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="bump-vmctl-${VERSION}"
          git checkout -b "$branch"
          git commit -am "vmctl: update to ${VERSION}"
          git push origin "$branch"
          gh pr create \
            --title "vmctl: update to ${VERSION}" \
            --body "Automated update to VictoriaMetrics v${VERSION}. Checksums computed from the release assets." \
            --base main --head "$branch"

      - name: Run CI on the bump branch and wait for it
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          gh workflow run test.yml --ref "bump-vmctl-${VERSION}"
          sleep 20
          run_id="$(gh run list --workflow test.yml --branch "bump-vmctl-${VERSION}" --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$run_id" --exit-status
