name: bump

# Groups sharing an upstream repo bump together in one PR. A PR touches only
# its own formula files, so open PRs do not conflict with each other; the
# README (version badges) and CHANGELOG (hand-written) are not edited here.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: victoriametrics
            repo: VictoriaMetrics/VictoriaMetrics
            formulas: "vmctl:vmutils vmagent:vmutils vmalert:vmutils vmauth:vmutils victoriametrics:victoria-metrics"
          - group: victorialogs
            repo: VictoriaMetrics/VictoriaLogs
            formulas: "victorialogs:victoria-logs"
          - group: victoriatraces
            repo: VictoriaMetrics/VictoriaTraces
            formulas: "victoriatraces:victoria-traces"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check for a new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          FORMULAS: ${{ matrix.formulas }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          latest="${latest#v}"
          behind=""
          suffix=""
          for pair in $FORMULAS; do
            formula="${pair%%:*}"
            current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "Formula/${formula}.rb")"
            if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -1)" != "$current" ]; then
              behind="$behind $pair"
              suffix="${suffix}-${formula}"
            fi
          done
          branch="bump-${latest}${suffix}"
          bump=true
          refresh=false
          verify_existing=false
          if [ -z "$behind" ]; then
            echo "All formulas are current for ${REPO} (latest: $latest)."
            bump=false
          elif git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            # Redo a branch that is behind main on top of main, so CI tests what would merge.
            behind_main="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq .behind_by)"
            if [ "$behind_main" -gt 0 ]; then
              echo "Bump branch ${branch} is ${behind_main} commits behind main; redoing the bump on top of main."
              refresh=true
            else
              echo "Bump branch ${branch} already exists; re-verifying its CI instead of re-pushing."
              bump=false
              verify_existing=true
            fi
          fi
          {
            echo "latest=$latest"
            echo "bump=$bump"
            echo "refresh=$refresh"
            echo "verify_existing=$verify_existing"
            echo "branch=$branch"
            echo "behind=${behind# }"
          } >> "$GITHUB_OUTPUT"

      - name: Update formulas, open PR
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          FORMULAS: ${{ matrix.formulas }}
          VERSION: ${{ steps.check.outputs.latest }}
          BEHIND: ${{ steps.check.outputs.behind }}
          REFRESH: ${{ steps.check.outputs.refresh }}
        run: |
          set -euo pipefail
          names=""
          added=()
          for pair in $BEHIND; do
            formula="${pair%%:*}"
            prefix="${pair#*:}"
            file="Formula/${formula}.rb"
            for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              url="https://github.com/${REPO}/releases/download/v${VERSION}/${prefix}-${asset}-v${VERSION}.tar.gz"
              curl --fail --location --silent --output "/tmp/${asset}.tar.gz" "$url"
              shasum -a 256 "/tmp/${asset}.tar.gz" | cut -d' ' -f1 > "/tmp/${asset}.sha256"
            done
            old_version="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$file")"
            sed -i "s/^  version \"${old_version}\"$/  version \"${VERSION}\"/" "$file"
            for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              sha="$(cat "/tmp/${asset}.sha256")"
              awk -v pat="${prefix}-${asset}-" -v sha="$sha" '
                index($0, pat) { print; getline; sub(/"[0-9a-f]+"/, "\"" sha "\"") }
                { print }
              ' "$file" > "${file}.new"
              mv "${file}.new" "$file"
            done
            grep -q "^  version \"${VERSION}\"$" "$file"
            for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              grep -q "$(cat "/tmp/${asset}.sha256")" "$file"
            done
            # The newest release's versioned formula rides in this PR; the generator skips
            # excluded releases, so add only a file it actually wrote.
            versioned="Formula/${formula}@${VERSION}.rb"
            if [ ! -e "$versioned" ]; then
              scripts/versioned-generate.sh --repo "$REPO" --prefix "$prefix" --formula "$formula" --version "$VERSION"
              if [ -e "$versioned" ]; then
                added+=("$versioned")
              fi
            fi
            names="${names:+$names, }${formula}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="${{ steps.check.outputs.branch }}"
          git add -u
          if [ "${#added[@]}" -gt 0 ]; then
            git add -- "${added[@]}"
          fi
          if [ "$REFRESH" = true ]; then
            scripts/ci-push-merge.sh "$branch"
            exit 0
          fi
          git checkout -b "$branch"
          git commit -m "${names}: update to ${VERSION}"
          git push origin "$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "${names}: update to ${VERSION}" \
            --body "Automated update to v${VERSION} from ${REPO}. Checksums computed from the release assets." \
            --base main --head "$branch")"
          # Older bump PRs for this group's formulae are superseded; their releases stay
          # installable as versioned formulae.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' > /tmp/open-prs
          while read -r number head; do
            case "$head" in bump-*) ;; *) continue ;; esac
            [ "$head" != "$branch" ] || continue
            ours=true
            for name in $(printf '%s' "${head#bump-*-}" | tr '-' ' '); do
              case " $FORMULAS" in *" ${name}:"*) ;; *) ours=false ;; esac
            done
            if [ "$ours" = true ]; then
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by ${pr_url} (v${VERSION}). If main lacks its versioned formula, the missing-releases step adds it."
            fi
          done < /tmp/open-prs

      - name: Run CI on the bump branch and wait for it
        if: steps.check.outputs.bump == 'true' || steps.check.outputs.verify_existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          set -euo pipefail
          scripts/ci-dispatch-and-wait.sh "$BRANCH"

      # Releases that releases/latest misses (an older patch, or anything a past run skipped)
      # get their own PR per group on a branch named after the list, so a broken old release
      # never holds up the plain bump and a rerun finds the same branch.
      - name: Add missing versioned formulae
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
          REPO: ${{ matrix.repo }}
          FORMULAS: ${{ matrix.formulas }}
          LATEST: ${{ steps.check.outputs.latest }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          set -euo pipefail
          # Start from the commit this job checked out, not from the plain bump branch.
          git checkout --quiet --force --detach "$GITHUB_SHA"
          git clean -fdq
          args=(--repo "$REPO" --pairs "$FORMULAS")
          # While any formula is behind, the newest release's versioned formulae belong to
          # the plain bump PR (new or already open), not to this one.
          if [ -n "$BEHIND" ]; then
            args+=(--exclude-version "$LATEST")
          fi
          missing="$(scripts/versioned-missing.sh "${args[@]}")"
          if [ -z "$missing" ]; then
            echo "No missing versioned formulae for ${REPO}."
            exit 0
          fi
          hash="$(printf '%s\n' "$missing" | sort | shasum -a 256 | cut -c1-8)"
          branch="versioned-${GROUP}-${hash}"
          refresh=false
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            behind_main="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq .behind_by)"
            if [ "$behind_main" -eq 0 ]; then
              echo "Branch ${branch} already exists; re-verifying its CI instead of re-pushing."
              scripts/ci-dispatch-and-wait.sh "$branch"
              exit 0
            fi
            echo "Branch ${branch} is ${behind_main} commits behind main; regenerating on top of main."
            refresh=true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          added=()
          list=""
          # fd 3 keeps the generator off the list on stdin.
          while read -r formula version <&3; do
            entry=""
            for pair in $FORMULAS; do
              if [ "${pair%%:*}" = "$formula" ]; then
                entry="$pair"
              fi
            done
            prefix="${entry#*:}"
            file="Formula/${formula}@${version}.rb"
            scripts/versioned-generate.sh --repo "$REPO" --prefix "$prefix" --formula "$formula" --version "$version"
            test -e "$file"
            added+=("$file")
            list="${list}- \`${formula}@${version}\`"$'\n'
          done 3<<< "$missing"
          subject="${GROUP}: add versioned formulae for ${#added[@]} releases"
          git add -- "${added[@]}"
          if [ "$refresh" = true ]; then
            scripts/ci-push-merge.sh "$branch"
            scripts/ci-dispatch-and-wait.sh "$branch"
            exit 0
          fi
          git checkout -b "$branch"
          git commit -m "$subject"
          git push origin "$branch"
          gh pr create --repo VictoriaMetrics/homebrew-tap \
            --title "$subject" \
            --body "$(printf 'Versioned formulae for %s releases the tap does not have yet. Checksums come from the upstream release checksum files.\n\n%s' "$REPO" "$list")" \
            --base main --head "$branch"
          scripts/ci-dispatch-and-wait.sh "$branch"
