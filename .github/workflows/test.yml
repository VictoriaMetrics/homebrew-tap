name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Which formulae to test
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Script tests
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/versioned/run.sh

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869  # 2026.08.24.1
        with:
          token: ${{ github.token }}

      - name: Tap this checkout
        # setup-homebrew already links the checkout as the tap on Linux; tap only when absent
        run: |
          brew tap | grep -q '^victoriametrics/tap$' || brew tap victoriametrics/tap "$GITHUB_WORKSPACE"

      - name: Select formulae
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SCOPE: ${{ inputs.scope || 'changed' }}
        run: |
          # capture first so a selector failure fails the step (no pipefail by default)
          selected="$(scripts/ci-select-formulae.sh "$EVENT" "$REF" "$SCOPE")"
          list="$(echo "$selected" | tr '\n' ' ')"
          echo "Selected: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install and test
        # Versioned tarballs are large (vmutils is ~143 MB, ~150 versions), so each one is
        # installed, tested, then its download and keg are removed before the next. The lowest
        # version of each tool stays installed so the PATH check runs next to a keg-only keg.
        env:
          FORMULAE: ${{ steps.select.outputs.list }}
        run: |
          plain=""
          versioned=""
          for f in $FORMULAE; do
            case "$f" in
              *@*) versioned="$versioned $f" ;;
              *) plain="$plain $f" ;;
            esac
          done

          status=0
          failures=""

          for f in $plain; do
            brew install "victoriametrics/tap/$f" || { failures="$failures\n$f: install"; status=1; continue; }
            brew test "victoriametrics/tap/$f" || { failures="$failures\n$f: test"; status=1; }
          done

          # lowest version per tool stays installed
          keep=""
          for name in $(for f in $versioned; do echo "${f%@*}"; done | sort -u); do
            lowest="$(for f in $versioned; do
              [ "${f%@*}" = "$name" ] && echo "${f#*@}"
            done | sort -V | head -n 1)"
            keep="$keep $name@$lowest"
          done

          for f in $versioned; do
            echo "::group::$f"
            if brew install "victoriametrics/tap/$f"; then
              brew test "victoriametrics/tap/$f" || { failures="$failures\n$f: test"; status=1; }
            else
              failures="$failures\n$f: install"
              status=1
            fi
            rm -f "$(brew --cache "victoriametrics/tap/$f")"
            case " $keep " in
              *" $f "*) ;;
              *) brew uninstall --force "victoriametrics/tap/$f" || true ;;
            esac
            echo "::endgroup::"
          done

          if [ "$status" -ne 0 ]; then
            echo "Failed formulae:" >&2
            printf '%b\n' "$failures" | sed '/^$/d' >&2
          fi
          exit "$status"

      - name: Plain formulae win on PATH
        # versioned formulae are keg-only, so the plain binary must stay the one on PATH
        run: |
          status=0
          for pair in vmctl:vmctl vmagent:vmagent vmalert:vmalert vmauth:vmauth \
            victoriametrics:victoria-metrics victorialogs:victoria-logs victoriatraces:victoria-traces; do
            formula="${pair%%:*}"
            bin="${pair##*:}"
            want="$(sed -n 's/^  version "\(.*\)"$/\1/p' "Formula/$formula.rb")"
            if [ -z "$want" ]; then
              echo "FAIL $bin: no version line found in Formula/$formula.rb" >&2
              status=1
              continue
            fi
            got="$("$(brew --prefix)/bin/$bin" --version 2>&1 || true)"
            case "$got" in
              *"$want"*) echo "ok   $bin $want" ;;
              *) echo "FAIL $bin: want $want, got: $got" >&2; status=1 ;;
            esac
          done
          exit "$status"

      - name: Style
        run: brew style victoriametrics/tap
