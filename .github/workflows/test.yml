name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869  # 2026.08.24.1

      - name: Tap this checkout
        run: brew tap victoriametrics/tap "$GITHUB_WORKSPACE"

      - name: Install
        run: brew install victoriametrics/tap/vmctl

      - name: Test
        run: brew test victoriametrics/tap/vmctl

      - name: Style
        run: brew style victoriametrics/tap
