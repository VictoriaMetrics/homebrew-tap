name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869  # 2026.08.24.1
        with:
          token: ${{ github.token }}

      - name: Tap this checkout
        # setup-homebrew already links the checkout as the tap on Linux; tap only when absent
        run: |
          brew tap | grep -q '^victoriametrics/tap$' || brew tap victoriametrics/tap "$GITHUB_WORKSPACE"

      - name: Install
        run: |
          for formula in vmctl victoriametrics victorialogs; do
            brew install "victoriametrics/tap/${formula}"
          done

      - name: Test
        run: |
          for formula in vmctl victoriametrics victorialogs; do
            brew test "victoriametrics/tap/${formula}"
          done

      - name: Style
        run: brew style victoriametrics/tap
