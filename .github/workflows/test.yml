name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Which formulae to test
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Script tests
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/versioned/run.sh

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869  # 2026.08.24.1
        with:
          token: ${{ github.token }}

      - name: Tap this checkout
        # setup-homebrew already links the checkout as the tap on Linux; tap only when absent
        run: |
          brew tap | grep -q '^victoriametrics/tap$' || brew tap victoriametrics/tap "$GITHUB_WORKSPACE"

      - name: Select formulae
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SCOPE: ${{ inputs.scope || 'changed' }}
        run: |
          # capture first so a selector failure fails the step (no pipefail by default)
          selected="$(scripts/ci-select-formulae.sh "$EVENT" "$REF" "$SCOPE")"
          list="$(echo "$selected" | tr '\n' ' ')"
          echo "Selected: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install and test
        # Versioned formulae are processed one at a time, grouped by version (sort -V, then
        # formula). Tarballs are large (vmutils is ~143 MB and backs ~150 formulae across 38
        # versions), so a download is deleted only after the last formula of the version that
        # shares it has been tested, and each keg is uninstalled after its test. The lowest
        # version of each tool stays installed so the PATH check runs next to a keg-only keg.
        env:
          FORMULAE: ${{ steps.select.outputs.list }}
        run: |
          plain=""
          versioned=""
          for f in $FORMULAE; do
            case "$f" in
              *@*) versioned="$versioned $f" ;;
              *) plain="$plain $f" ;;
            esac
          done

          status=0
          failures=""
          fail() { failures="$failures\n$1: $2"; status=1; }

          for f in $plain; do
            brew install "victoriametrics/tap/$f" || { fail "$f" install; continue; }
            brew test "victoriametrics/tap/$f" || fail "$f" test
          done

          # "<version> <formula>" lines ordered by version, then formula
          ordered="$(for f in $versioned; do echo "${f#*@} $f"; done | sort -V)"

          # the lowest version of each tool (first seen in version order) stays installed
          keep=""
          while read -r _ f; do
            [ -n "$f" ] || continue
            case " $keep " in
              *" ${f%@*}@"*) ;;
              *) keep="$keep $f" ;;
            esac
          done <<EOF
          $ordered
          EOF

          for version in $(echo "$ordered" | awk '{print $1}' | uniq); do
            group="$(echo "$ordered" | awk -v v="$version" '$1 == v {print $2}')"
            # download of each formula, so formulae sharing a tarball share a path
            caches=""
            for f in $group; do
              caches="$caches
          $f $(brew --cache "victoriametrics/tap/$f")"
            done
            remaining="$group"
            for f in $group; do
              echo "::group::$f"
              installed=0
              if brew install "victoriametrics/tap/$f"; then
                installed=1
                brew test "victoriametrics/tap/$f" || fail "$f" test
              else
                fail "$f" install
              fi
              remaining="$(echo "$remaining" | awk -v f="$f" '$1 != f')"
              mine="$(echo "$caches" | awk -v f="$f" '$1 == f {print $2}')"
              shared=0
              for r in $remaining; do
                [ "$(echo "$caches" | awk -v f="$r" '$1 == f {print $2}')" = "$mine" ] && shared=1
              done
              [ "$shared" = 1 ] || rm -f "$mine"
              if [ "$installed" = 1 ]; then
                case " $keep " in
                  *" $f "*) ;;
                  *) brew uninstall --force "victoriametrics/tap/$f" || fail "$f" uninstall ;;
                esac
              fi
              echo "::endgroup::"
            done
          done

          if [ "$status" -ne 0 ]; then
            echo "Failed formulae:" >&2
            printf '%b\n' "$failures" | sed '/^$/d' >&2
          fi
          exit "$status"

      - name: Plain formulae win on PATH
        # versioned formulae are keg-only, so the plain binary must stay the one on PATH
        run: |
          status=0
          for pair in vmctl:vmctl vmagent:vmagent vmalert:vmalert vmauth:vmauth \
            victoriametrics:victoria-metrics victorialogs:victoria-logs victoriatraces:victoria-traces; do
            formula="${pair%%:*}"
            bin="${pair##*:}"
            want="$(sed -n 's/^  version "\(.*\)"$/\1/p' "Formula/$formula.rb")"
            if [ -z "$want" ]; then
              echo "FAIL $bin: no version line found in Formula/$formula.rb" >&2
              status=1
              continue
            fi
            got="$("$(brew --prefix)/bin/$bin" --version 2>&1 || true)"
            case "$got" in
              *"$want"*) echo "ok   $bin $want" ;;
              *) echo "FAIL $bin: want $want, got: $got" >&2; status=1 ;;
            esac
          done
          exit "$status"

      - name: Style
        run: brew style victoriametrics/tap
